[package]
name = "permitt"
description = "What each AI assistant on this machine may do without asking, and which setting says so — the inspector, not the guard"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "permitt-app"
path = "src/main.rs"

[dependencies]
permitt-core = { path = "../core" }
bbl-hostrules.workspace = true
iced = { version = "=0.13.1", features = ["tokio"] }
bbl-ui = { git = "https://github.com/blackberrylabs/bbl-ui", tag = "v0.1.0" }
serde.workspace = true
serde_json.workspace = true

# ---------------------------------------------------------------- packaging
# `packaging/build.sh` builds the workspace once, then runs `cargo deb --no-build` and
# `cargo generate-rpm` from here, so one package ships both binaries.

[package.metadata.deb]
name = "permitt"
maintainer = "Alexandre Do <alexandre@blackberrylabs.dev>"
copyright = "2026, Alexandre Do"
license-file = ["../../LICENSE", "0"]
extended-description = """\
Permitt shows what each AI coding assistant installed on a Linux machine may do without \
asking — run shell commands, edit files, reach the network, call MCP tools — and which \
setting, in which file, says so: Claude Code, Codex, Cursor, VS Code, Copilot CLI, Gemini \
CLI, Qwen Code, Cline, OpenCode, Goose, Zed, Kiro, Amp, Aider, Devin Desktop. It reads the \
hosts' settings files and shell start-up files and never writes to them. Ships the desktop \
app (permitt-app) and the command line (permitt)."""
section = "devel"
priority = "optional"
depends = "$auto, libxkbcommon0, libwayland-client0 | libx11-6"
recommends = "libvulkan1, mesa-vulkan-drivers"
assets = [
    ["target/release/permitt-app", "usr/bin/", "755"],
    ["target/release/permitt", "usr/bin/", "755"],
    ["../../assets/permitt.desktop", "usr/share/applications/", "644"],
    ["../../assets/icon.svg", "usr/share/icons/hicolor/scalable/apps/permitt.svg", "644"],
    ["../../assets/icon-16.png", "usr/share/icons/hicolor/16x16/apps/permitt.png", "644"],
    ["../../assets/icon-32.png", "usr/share/icons/hicolor/32x32/apps/permitt.png", "644"],
    ["../../assets/icon-48.png", "usr/share/icons/hicolor/48x48/apps/permitt.png", "644"],
    ["../../assets/icon-64.png", "usr/share/icons/hicolor/64x64/apps/permitt.png", "644"],
    ["../../assets/icon-128.png", "usr/share/icons/hicolor/128x128/apps/permitt.png", "644"],
    ["../../assets/icon-256.png", "usr/share/icons/hicolor/256x256/apps/permitt.png", "644"],
    ["../../assets/icon-512.png", "usr/share/icons/hicolor/512x512/apps/permitt.png", "644"],
    ["../../README.md", "usr/share/doc/permitt/README.md", "644"],
]

[package.metadata.generate-rpm]
name = "permitt"
summary = "What each AI assistant on this machine may do without asking"
license = "MIT"
url = "https://github.com/blackberrylabs/permitt"
requires = { libxkbcommon = "*" }
assets = [
    { source = "target/release/permitt-app", dest = "/usr/bin/permitt-app", mode = "755" },
    { source = "target/release/permitt", dest = "/usr/bin/permitt", mode = "755" },
    { source = "assets/permitt.desktop", dest = "/usr/share/applications/permitt.desktop", mode = "644" },
    { source = "assets/icon.svg", dest = "/usr/share/icons/hicolor/scalable/apps/permitt.svg", mode = "644" },
    { source = "assets/icon-16.png", dest = "/usr/share/icons/hicolor/16x16/apps/permitt.png", mode = "644" },
    { source = "assets/icon-32.png", dest = "/usr/share/icons/hicolor/32x32/apps/permitt.png", mode = "644" },
    { source = "assets/icon-48.png", dest = "/usr/share/icons/hicolor/48x48/apps/permitt.png", mode = "644" },
    { source = "assets/icon-64.png", dest = "/usr/share/icons/hicolor/64x64/apps/permitt.png", mode = "644" },
    { source = "assets/icon-128.png", dest = "/usr/share/icons/hicolor/128x128/apps/permitt.png", mode = "644" },
    { source = "assets/icon-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/permitt.png", mode = "644" },
    { source = "assets/icon-512.png", dest = "/usr/share/icons/hicolor/512x512/apps/permitt.png", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/permitt/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/permitt/LICENSE", mode = "644", doc = true },
]
