# Permitt host rule. Read by the inventory, never written. Every claim names its source.
# Schema: docs/hosts.md.

id = "amp"
name = "Amp"
vendor = "Sourcegraph"
kind = "cli"
status = "active"
binaries = ["amp"]

[defaults]
commands = "denylist"
files = "auto"
network = "auto"
mcp = "auto"
note = "Amp does not ask by default; built-in rules still ask for git push, rm -rf, find -delete/-exec and absolute-path commands (196 built-in rules in the CLI)"
[defaults.source]
kind = "documentation"
url = "https://ampcode.com/docs/customize/tools"
read_on = 2026-10-16
quote = "By default, Amp does not ask for approval before running tools."

[precedence]
order = ["managed", "project", "user"]
lists = "merged"
status = "documented"
note = "workspace overrides user; managed-settings.json over the workspace document; permission rules: first matching rule wins, user rules before built-ins"
[precedence.source]
kind = "documentation"
url = "https://ampcode.com/docs/cli/settings"
read_on = 2026-10-16
quote = "When the same setting appears in multiple places, workspace settings override user settings."

[[unknown]]
capabilities = []
overrides_state = false
reason = "amp.permissions and amp.dangerouslyAllowAll are described only by the CLI's own --help and strings, not by the current documentation or settings schema; treat their reading as observed"

[[locations]]
scope = "system"
level = "managed"
format = "jsonc"
path.linux = "/etc/ampcode/managed-settings.json"
path.macos = "/Library/Application Support/ampcode/managed-settings.json"
path.windows = "%ProgramData%/ampcode/managed-settings.json"
[locations.source]
kind = "documentation"
url = "https://ampcode.com/docs/cli/settings"
read_on = 2026-10-16
quote = "Linux /etc/ampcode/managed-settings.json"

[[locations]]
scope = "user"
level = "user"
format = "jsonc"
path.any = ["${AMP_SETTINGS_FILE}", "~/.config/amp/settings.json", "~/.config/amp/settings.jsonc"]
[locations.source]
kind = "documentation"
url = "https://ampcode.com/docs/cli/settings"
read_on = 2026-10-16
quote = "macOS/Linux ~/.config/amp/settings.json or .jsonc"

[[locations]]
scope = "project"
level = "project"
format = "jsonc"
path.any = [".amp/settings.json", ".amp/settings.jsonc"]
[locations.source]
kind = "documentation"
url = "https://ampcode.com/docs/cli/settings"
read_on = 2026-10-16
quote = "the nearest .amp/settings.json or .amp/settings.jsonc, searched upward from your current working directory to the repository root"

[[settings]]
key = "amp\\.dangerouslyAllowAll"
kind = "mode"
[settings.states."true"]
all = "auto"
_note = "all command confirmation prompts disabled"
[settings.states."false"]
_note = "legacy ask-based mode kept active"
[settings.source]
kind = "observed"
read_on = 2026-10-16
quote = "amp --help: amp.dangerouslyAllowAll — Disable all command confirmation prompts (agent will execute all commands without asking)"

[[settings]]
key = "amp\\.permissions"
kind = "object-rules"
tool_field = "tool"
effect_field = "action"
[settings.tool_map]
Bash = "commands"
shell_command = "commands"
async_shell_command = "commands"
edit_file = "files"
create_file = "files"
delete_file = "files"
read_web_page = "network"
web_search = "network"
"mcp__*" = "mcp"
"*" = "all"
Task = "ignore"
Read = "ignore"
glob = "ignore"
Grep = "ignore"
_default = "ignore"
[settings.effect_values]
allow = "allow"
ask = "ask"
reject = "deny"
delegate = "ask"
[settings.source]
kind = "observed"
read_on = 2026-10-16
quote = "amp permissions --help: { \"tool\": \"Bash\", \"action\": \"ask\", \"matches\": { \"cmd\": [\"git push*\"] } } — actions allow | reject | ask | delegate; Rules are evaluated in order, so newer rules take precedence."

[[settings]]
key = "amp\\.mcpPermissions"
kind = "object-rules"
tool_field = "action"
effect_field = "action"
guard = "MCP server allow/reject rules"
[settings.tool_map]
_default = "mcp"
[settings.effect_values]
allow = "allow"
reject = "deny"
[settings.source]
kind = "documentation"
url = "https://ampcode.com/docs/customize/tools"
read_on = 2026-10-16
quote = "Allow or block MCP servers that match a pattern. Amp applies the first matching rule. If no rule matches an MCP server, Amp allows it."
note = "server-level, not per call: shown as a guard"

[[settings]]
key = "amp\\.tools\\.disable"
kind = "rules"
effect = "deny"
[settings.tool_map]
"builtin:Bash" = "commands"
"builtin:shell_command" = "commands"
"builtin:edit_file" = "files"
"builtin:create_file" = "files"
"builtin:read_web_page" = "network"
"builtin:web_search" = "network"
"mcp__*" = "mcp"
_default = "ignore"
[settings.source]
kind = "documentation"
url = "https://ampcode.com/docs/customize/tools"
read_on = 2026-10-16
quote = "amp.tools.disable (array, glob *, builtin:toolname)"
