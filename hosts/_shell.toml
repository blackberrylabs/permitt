# Shell start-up files Permitt reads (D2), and the closed list of flags and variables it
# looks for. Only a line that matches is kept. Each entry names the documentation it comes from.

files = [
  "~/.bashrc", "~/.bash_profile", "~/.bash_aliases", "~/.profile",
  "~/.zshrc", "~/.zprofile", "~/.zshenv",
  "~/.config/fish/config.fish",
]

# ---- Claude Code --------------------------------------------------------------------------
[[flags]]
host = "claude-code"
kind = "flag"
pattern = "--dangerously-skip-permissions"
effect = "skips every permission prompt (equivalent to --permission-mode bypassPermissions)"
[flags.source]
kind = "documentation"
url = "https://code.claude.com/docs/en/cli-reference"
read_on = 2026-10-16
quote = "Skip permission prompts. Equivalent to --permission-mode bypassPermissions."

[[flags]]
host = "claude-code"
kind = "flag"
pattern = "--allow-dangerously-skip-permissions"
effect = "adds bypassPermissions to the Shift+Tab mode cycle"
[flags.source]
kind = "documentation"
url = "https://code.claude.com/docs/en/cli-reference"
read_on = 2026-10-16
quote = "Add bypassPermissions to the Shift+Tab mode cycle without starting in it."

[[flags]]
host = "claude-code"
kind = "flag"
pattern = "--permission-mode"
effect = "starts in the given permission mode (bypassPermissions, auto, acceptEdits, dontAsk…), overriding defaultMode from settings files"
[flags.source]
kind = "documentation"
url = "https://code.claude.com/docs/en/cli-reference"
read_on = 2026-10-16
quote = "Begin in a specified permission mode. … Overrides defaultMode from settings files"

[[flags]]
host = "claude-code"
kind = "flag"
pattern = "--permission-prompts"
effect = "with `none`, every prompt is denied instead of asked"
[flags.source]
kind = "documentation"
url = "https://code.claude.com/docs/en/cli-reference"
read_on = 2026-10-16
quote = "Pass none when nobody can answer, and Claude Code denies them instead."

# ---- Codex CLI ----------------------------------------------------------------------------
[[flags]]
host = "codex"
kind = "flag"
pattern = "--dangerously-bypass-approvals-and-sandbox"
effect = "runs every command without approvals or sandboxing"
[flags.source]
kind = "documentation"
url = "https://learn.chatgpt.com/docs/developer-commands?surface=cli"
read_on = 2026-10-16
quote = "Run every command without approvals or sandboxing. Only use inside an externally hardened environment."

[[flags]]
host = "codex"
kind = "flag"
pattern = "--yolo"
effect = "alias of --dangerously-bypass-approvals-and-sandbox (Codex), or of --force (Cursor CLI), or of --allow-all (Copilot CLI), or auto-approve all actions (Gemini CLI, Qwen Code, Cline CLI)"
[flags.source]
kind = "documentation"
url = "https://learn.chatgpt.com/docs/developer-commands?surface=cli"
read_on = 2026-10-16
quote = "--dangerously-bypass-approvals-and-sandbox, --yolo: Run every command without approvals or sandboxing."

[[flags]]
host = "codex"
kind = "flag"
pattern = "--ask-for-approval never"
effect = "anything that would need approval is rejected automatically, never asked"
[flags.source]
kind = "documentation"
url = "https://learn.chatgpt.com/docs/developer-commands?surface=cli"
read_on = 2026-10-16
quote = "--ask-for-approval, -a (on-request | never): Control when Codex pauses for human approval before running a command."

[[flags]]
host = "codex"
kind = "flag"
pattern = "-a never"
effect = "short form of --ask-for-approval never"
[flags.source]
kind = "documentation"
url = "https://learn.chatgpt.com/docs/developer-commands?surface=cli"
read_on = 2026-10-16
quote = "--ask-for-approval, -a"

[[flags]]
host = "codex"
kind = "flag"
pattern = "--sandbox danger-full-access"
effect = "no sandbox: read, edit, run and reach the network without approval"
[flags.source]
kind = "documentation"
url = "https://learn.chatgpt.com/docs/agent-approvals-security"
read_on = 2026-10-16
quote = "--sandbox danger-full-access … read files, make edits, and run commands with network access without approval."

[[flags]]
host = "codex"
kind = "flag"
pattern = "-s danger-full-access"
effect = "short form of --sandbox danger-full-access"
[flags.source]
kind = "documentation"
url = "https://learn.chatgpt.com/docs/developer-commands?surface=cli"
read_on = 2026-10-16
quote = "--sandbox, -s (read-only | workspace-write | danger-full-access)"

# ---- Gemini CLI / Qwen Code ---------------------------------------------------------------
[[flags]]
host = "gemini-cli"
kind = "flag"
pattern = "--approval-mode yolo"
effect = "auto-approves every tool call"
[flags.source]
kind = "documentation"
url = "https://geminicli.com/docs/reference/configuration/"
read_on = 2026-10-16
quote = "yolo: Automatically approve all tool calls (equivalent to --yolo)"

[[flags]]
host = "gemini-cli"
kind = "flag"
pattern = "--approval-mode=yolo"
effect = "auto-approves every tool call"
[flags.source]
kind = "documentation"
url = "https://geminicli.com/docs/cli/cli-reference/"
read_on = 2026-10-16
quote = "Deprecated. Auto-approve all actions. Use --approval-mode=yolo instead."

[[flags]]
host = "qwen-code"
kind = "flag"
pattern = "--approval-mode yolo"
effect = "auto-approves every tool call; does not enable a sandbox"
[flags.source]
kind = "documentation"
url = "https://qwenlm.github.io/qwen-code-docs/en/users/configuration/settings/"
read_on = 2026-10-16
