[[hosts]]
id = "roo-code"
name = "Roo Code"
reason = "every auto-approval toggle (autoApprovalEnabled, alwaysAllowExecute, alwaysAllowWrite, alwaysAllowMcp…) lives only in VS Code's state database (state.vscdb, SQLite); only the command allow/deny lists are mirrored to settings.json, and alone they decide nothing (D7)"

