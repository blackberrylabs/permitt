  </defs>
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bg)"/>
  <rect x="112" y="96" width="288" height="320" rx="28" fill="#f4f6f9"/>
  <g fill="#7a869a">
    <rect x="148" y="146" width="112" height="18" rx="9"/>
    <rect x="148" y="216" width="112" height="18" rx="9"/>
    <rect x="148" y="286" width="112" height="18" rx="9"/>
